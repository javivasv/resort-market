<button
  type="button"
  class="rounded-full px-4 py-1.5 text-sm font-medium transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500"
  [class.bg-blue-600]="selected()"
  [class.text-white]="selected()"
  [class.bg-gray-100]="!selected()"
  [class.text-gray-700]="!selected()"
  [attr.aria-pressed]="selected()"
  (click)="onClick()"
>
  {{ option().label }}
</button>
