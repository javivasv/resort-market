<div class="h-full w-full">
  <header class="flex items-center justify-between border-b border-gray-200 p-5">
    <a routerLink="/home" class="text-3xl font-bold text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded">Resort Market</a>

    <a
      routerLink="/cart"
      class="relative inline-flex items-center text-gray-600 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded"
      [attr.aria-label]="cartItemCount() > 0 ? 'Cart, ' + cartItemCount() + ' items' : 'Cart, empty'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-6 w-6" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.998-4.706 2.615-7.199.075-.3-.155-.591-.463-.591H5.106M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
      </svg>

      @if (cartItemCount() > 0) {
        <span aria-hidden="true" class="absolute -right-2 -top-2 flex h-5 w-5 items-center justify-center rounded-full bg-blue-600 text-xs font-semibold text-white">
          {{ cartItemCount() }}
        </span>
      }
    </a>
  </header>

  <main class="p-5">
    <router-outlet></router-outlet>
  </main>
</div>
