<section class="mx-auto max-w-5xl p-6">
  <div class="mb-6 flex flex-wrap items-center gap-3">
    <div class="flex flex-wrap gap-2">
      @for (option of categories; track option.value) {
        <activity-categories
          [option]="option"
          [selected]="category() === option.value"
          (select)="setCategory($event)"
        ></activity-categories>
      }
    </div>

    <input
      type="search"
      placeholder="Search activities..."
      class="ml-auto rounded-md border border-gray-300 px-3 py-1.5 text-sm focus:border-blue-500 focus:outline-none"
      [value]="search()"
      (input)="setSearch($any($event.target).value)"
    />
  </div>

  @if (loading()) {
    <div class="flex justify-center py-12" role="status" aria-label="Loading activities">
      <div class="h-8 w-8 animate-spin rounded-full border-2 border-gray-300 border-t-blue-600"></div>
    </div>
  } @else if (result(); as res) {
    @if (res.items.length === 0) {
      <p class="text-gray-500">No activities match your filters.</p>
    } @else {
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        @for (activity of res.items; track activity.id) {
          <activity-card [activity]="activity"></activity-card>
        }
      </div>

      @if (pages().length > 1) {
        <div class="mt-6 flex items-center justify-center gap-2">
          @for (p of pages(); track p) {
            <button
              type="button"
              class="h-8 w-8 rounded-full text-sm cursor-pointer"
              [class.bg-blue-600]="res.meta.currentPage === p"
              [class.text-white]="res.meta.currentPage === p"
              [class.bg-gray-100]="res.meta.currentPage !== p"
              (click)="goToPage(p)"
            >
              {{ p }}
            </button>
          }
        </div>
      }
    }
  }
</section>
